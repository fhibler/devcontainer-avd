name: Test
on:
  push:
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        type: string
        required: true
    outputs:
      version:
        value: ${{ jobs.prepare.outputs.version }}
      commit:
        value: ${{ jobs.prepare.outputs.commit }}
permissions:
  contents: read
concurrency:
  group: test-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
      - name: Load tool versions
        run: cat scripts/versions.env >> "$GITHUB_ENV"
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: ${{ env.NODE_MAJOR }}
      - name: Install validation tools
        run: bash scripts/install-ci-tools.sh
      - name: Validate
        run: bash scripts/validate.sh
  prepare:
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      platform_groups: ${{ steps.prepare.outputs.platform_groups }}
      scenario_groups: ${{ steps.prepare.outputs.scenario_groups }}
      version: ${{ steps.prepare.outputs.version }}
      commit: ${{ steps.prepare.outputs.commit }}
      cache_key: ${{ steps.prepare.outputs.cache_key }}
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
      - name: Select download workspace
        run: |
          printf 'AVD_DOWNLOAD_WORK=%s/avd-downloads\nAVD_CI_DOWNLOADS=%s/avd-downloads/seed\n' "$RUNNER_TEMP" "$RUNNER_TEMP" >> "$GITHUB_ENV"
      - name: Load tool versions
        run: cat scripts/versions.env >> "$GITHUB_ENV"
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: ${{ env.NODE_MAJOR }}
      - run: npm install --global "@devcontainers/cli@$DEVCONTAINER_CLI"
      - id: prepare
        env:
          AVD_CACHE_RECORD: ${{ runner.temp }}/avd-downloads/shared
        run: python3 scripts/ci.py prepare
      - id: source-cache
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ${{ runner.temp }}/avd-downloads/shared/sources
          key: avd-source-v1-${{ steps.prepare.outputs.source_key }}
      - name: Prepare pinned source downloads
        run: python3 scripts/downloads.py sources
      - name: Save verified source snapshots
        if: ${{ success() && steps.source-cache.outputs.cache-hit != 'true' && github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ${{ runner.temp }}/avd-downloads/shared/sources
          key: ${{ steps.source-cache.outputs.cache-primary-key }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: shared-downloads
          path: ${{ runner.temp }}/avd-downloads/bundles/shared.tgz*
          if-no-files-found: error
          retention-days: 3
          compression-level: 0
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tested-feature
          path: artifacts/
          if-no-files-found: error
  downloads:
    name: Downloads (${{ matrix.runner == 'ubuntu-24.04-arm' && 'arm64' || 'amd64' }}, Python ${{ matrix.python }})
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
        python: ['3.12', '3.13', '3.14']
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
      - name: Select download workspace
        run: |
          printf 'AVD_DOWNLOAD_WORK=%s/avd-downloads\nAVD_CI_DOWNLOADS=%s/avd-downloads/seed\n' "$RUNNER_TEMP" "$RUNNER_TEMP" >> "$GITHUB_ENV"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: tested-feature
          path: artifacts
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: shared-downloads
          path: ${{ runner.temp }}/avd-downloads/bundles
      - name: Verify Feature archive
        working-directory: artifacts
        run: sha256sum -c SHA256SUMS
      - id: raw-cache
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ${{ runner.temp }}/avd-downloads/raw
          key: avd-download-v1-${{ runner.os }}-${{ runner.arch }}-${{ matrix.python }}-${{ hashFiles('src/avd/bootstrap.env') }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            avd-download-v1-${{ runner.os }}-${{ runner.arch }}-${{ matrix.python }}-${{ hashFiles('src/avd/bootstrap.env') }}-
      - name: Warm native downloads
        env:
          PYTHON_MINOR: ${{ matrix.python }}
        run: python3 scripts/downloads.py warm "$PYTHON_MINOR"
      - name: Save verified downloads
        if: ${{ success() && github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ${{ runner.temp }}/avd-downloads/raw
          key: ${{ steps.raw-cache.outputs.cache-primary-key }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: downloads-${{ runner.arch }}-py${{ matrix.python }}
          path: ${{ runner.temp }}/avd-downloads/bundles/py*.tgz*
          if-no-files-found: error
          compression-level: 0
          retention-days: 3
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: download-logs-${{ runner.arch }}-py${{ matrix.python }}
          path: artifacts/downloads-*/
  platform:
    name: Platform (${{ matrix.runner == 'ubuntu-24.04-arm' && 'arm64' || 'amd64' }}, ${{ join(fromJSON(matrix.group.images), ', ') }})
    needs: [prepare, downloads]
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
        group: ${{ fromJSON(needs.prepare.outputs.platform_groups) }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
      - name: Select download workspace
        run: |
          printf 'AVD_DOWNLOAD_WORK=%s/avd-downloads\nAVD_CI_DOWNLOADS=%s/avd-downloads/seed\n' "$RUNNER_TEMP" "$RUNNER_TEMP" >> "$GITHUB_ENV"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: tested-feature
          path: artifacts
      - name: Verify archive checksum
        working-directory: artifacts
        run: sha256sum -c SHA256SUMS
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: downloads-${{ runner.arch }}-py3.14
          path: ${{ runner.temp }}/avd-downloads/bundles
      - name: Verify and merge download inputs
        run: python3 scripts/downloads.py merge
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - id: build-cache
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ${{ runner.temp }}/avd-build-cache
          key: avd-build-v1-${{ runner.os }}-${{ runner.arch }}-platform-${{ matrix.group.id }}-${{ needs.prepare.outputs.cache_key }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            avd-build-v1-${{ runner.os }}-${{ runner.arch }}-platform-${{ matrix.group.id }}-${{ needs.prepare.outputs.cache_key }}-
      - name: Test native platform
        env:
          TEST_IMAGES: ${{ matrix.group.images }}
          AVD_BUILD_CACHE: ${{ runner.temp }}/avd-build-cache
        run: python3 scripts/ci.py platform-group "$TEST_IMAGES"
      - name: Save successful build cache
        if: ${{ success() && github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ${{ runner.temp }}/avd-build-cache
          key: ${{ steps.build-cache.outputs.cache-primary-key }}
      - name: Collect diagnostics
        if: always()
        run: docker ps -a > artifacts/containers.txt
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: platform-${{ matrix.runner == 'ubuntu-24.04-arm' && 'arm64' || 'amd64' }}-${{ matrix.group.id }}
          path: artifacts/
  integration:
    name: Integration (${{ matrix.runner == 'ubuntu-24.04-arm' && 'arm64' || 'amd64' }}, ${{ matrix.group.image }}, ${{ join(fromJSON(matrix.group.scenarios), ', ') }})
    needs: [prepare, downloads]
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
        group: ${{ fromJSON(needs.prepare.outputs.scenario_groups) }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
      - name: Select download workspace
        run: |
          printf 'AVD_DOWNLOAD_WORK=%s/avd-downloads\nAVD_CI_DOWNLOADS=%s/avd-downloads/seed\n' "$RUNNER_TEMP" "$RUNNER_TEMP" >> "$GITHUB_ENV"
      - name: Load tool versions
        run: cat scripts/versions.env >> "$GITHUB_ENV"
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: ${{ env.NODE_MAJOR }}
      - run: npm install --global "@devcontainers/cli@$DEVCONTAINER_CLI"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: tested-feature
          path: artifacts
      - name: Verify archive checksum
        working-directory: artifacts
        run: sha256sum -c SHA256SUMS
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: downloads-${{ runner.arch }}-${{ matrix.group.downloads }}
          merge-multiple: true
          path: ${{ runner.temp }}/avd-downloads/bundles
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: matrix.group.sources
        with:
          name: shared-downloads
          path: ${{ runner.temp }}/avd-downloads/bundles
      - name: Verify and merge download inputs
        run: python3 scripts/downloads.py merge
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - id: build-cache
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ${{ runner.temp }}/avd-build-cache
          key: avd-build-v1-${{ runner.os }}-${{ runner.arch }}-integration-${{ matrix.group.id }}-${{ needs.prepare.outputs.cache_key }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            avd-build-v1-${{ runner.os }}-${{ runner.arch }}-integration-${{ matrix.group.id }}-${{ needs.prepare.outputs.cache_key }}-
      - name: Test lifecycle and options
        env:
          SCENARIOS: ${{ matrix.group.scenarios }}
          AVD_BUILD_CACHE: ${{ runner.temp }}/avd-build-cache
        run: python3 scripts/ci.py scenario-group "$SCENARIOS"
      - name: Save successful build cache
        if: ${{ success() && github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ${{ runner.temp }}/avd-build-cache
          key: ${{ steps.build-cache.outputs.cache-primary-key }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: integration-${{ matrix.runner == 'ubuntu-24.04-arm' && 'arm64' || 'amd64' }}-${{ matrix.group.id }}
          path: artifacts/
  required:
    name: Required tests
    if: always()
    needs: [validate, prepare, downloads, platform, integration]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require every result
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PY'
          import json, os
          results = json.loads(os.environ['RESULTS'])
          assert all(job['result'] == 'success' for job in results.values()), results
          PY
